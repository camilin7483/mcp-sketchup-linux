[project]
name = "mcp-sketchup"
version = "0.1.0"
description = "Local SketchUp MCP bridge with persistent simulation mode"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "licenses/*.txt"]
authors = [{name = "cam"}]
dependencies = ["mcp[cli]>=1.3.0,<2", "pydantic>=2.0"]

[project.scripts]
mcp-sketchup = "server:main"
sketchup-mcp = "server:main"

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
